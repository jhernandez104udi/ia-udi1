<script>
  (function(){
    try {
      var k = 'udi_theme_v1';
      var saved = localStorage.getItem(k);
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.dataset.theme = theme;
    } catch(e){}
  })();
</script>
<style>
  :root {
    --bg: #f7f8fb; --bg-elev: #ffffff; --bg-soft: #eef1f7;

    --ease: cubic-bezier(.22,.61,.36,1);
  }
  .dark {
    --bg: #0b1020; --bg-elev: #121933; --bg-soft: #182044;
    --text: #e6eaf5; --text-soft: #a9b2cf; --text-muted: #6b7494;
    --border: #232b4d; --border-strong: #2f3966;
    --primary: #818cf8; --primary-600: #6366f1; --primary-soft: #1e2550;
    --success: #34d399; --success-soft: #0f3a2c;
    --warning: #fbbf24; --warning-soft: #3a2d0f;
    --danger: #f87171; --danger-soft: #3a1414;
    --info: #38bdf8; --info-soft: #0f2a3a;
    --m1: #a5b4fc; --m2: #7dd3fc; --m3: #fcd34d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);

  * { box-sizing: border-box; }

  button { font-family: inherit; }
  :focus { outline: none; }

  .app { min-height: 100dvh; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 30; backdrop-filter: saturate(180%) blur(10px); background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom: 1px solid var(--border); }

  .brand-title { font-size: 14px; line-height: 1.1; }

  .feat-ico svg { width: 16px; height: 16px; }
  .feat b { display: block; font-size: 13px; margin-bottom: 2px; }

  .quiz-wrap { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1024px) { .quiz-wrap { grid-template-columns: 1fr 320px; gap: 20px; } }
  .progress-seg { display: flex; gap: 4px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-soft); border: 1px solid var(--border); }

  .progress-seg > div.done::after { background: var(--success); opacity: 1; }
  .progress-seg > div.current::after { background: var(--primary); opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .progress-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-soft); margin-top: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .q-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .module-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: white; }
  .module-badge.m1 { background: var(--m1); }
  .module-badge.m2 { background: var(--m2); }
  .module-badge.m3 { background: var(--m3); }

  .diff-badge.easy { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); background: var(--success-soft); }
  .diff-badge.med { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 40%, var(--border)); background: var(--warning-soft); }

  .opt[aria-pressed="true"] .opt-letter { background: var(--primary); color: white; border-color: var(--primary); }
  .opt-text { font-size: 15px; line-height: 1.45; padding-top: 2px; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .timer-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .timer-ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--primary); animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .q-nav { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

  .side-panel { position: sticky; top: 80px; align-self: start; }
  .panel-section { margin-bottom: 14px; }

  .q-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .q-dot { aspect-ratio: 1/1; min-height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-soft); font-size: 12px; font-weight: 600; display: grid; place-items: center; cursor: pointer; position: relative; }
  .q-dot:hover { transform: translateY(-1px); border-color: var(--border-strong); }
  .q-dot.current { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }
  .q-dot.answered { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
  .q-dot.review::before { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .q-dot.last-answered::after { content: ''; position: absolute; bottom: 3px; left: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--info); }
  .bottom-sheet { display: none; }
  @media (max-width: 1023px) {
    .bottom-sheet { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg-elev); border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px -10px rgba(0,0,0,.2); transform: translateY(calc(100% - 60px)); transition: transform .35s var(--ease); padding-bottom: env(safe-area-inset-bottom); }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 10px auto 6px; }
    .sheet-header { padding: 4px 16px 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .sheet-header h3 { margin: 0; font-size: 14px; font-weight: 700; flex: 1; }
    .sheet-body { max-height: 55vh; overflow-y: auto; padding: 0 16px 16px; }
    main { padding-bottom: 140px; }
  }
  .result-hero { position: relative; border-radius: var(--radius-xl); padding: 32px 24px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); }
  .result-hero.n1 { background: linear-gradient(135deg, color-mix(in srgb, var(--info) 18%, var(--bg-elev)), var(--bg-elev)); }
  .result-hero.n2 { background: linear-gradient(135deg, color-mix(in srgb, var(--success) 18%, var(--bg-elev)), var(--bg-elev)); }
  .result-hero.n3 { background: linear-gradient(135deg, color-mix(in srgb, var(--warning) 22%, var(--bg-elev)), var(--bg-elev)); }
  .result-hero.n4 { background: linear-gradient(135deg, color-mix(in srgb, #a855f7 25%, var(--bg-elev)), color-mix(in srgb, var(--primary) 18%, var(--bg-elev))); }
  .score-big { font-size: clamp(48px, 10vw, 84px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(135deg, var(--primary), #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .level-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--bg-elev); border: 1px solid var(--border); }
  .integrity { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .integrity.green { background: var(--success-soft); color: var(--success); }
  .integrity.yellow { background: var(--warning-soft); color: var(--warning); }
  .integrity.red { background: var(--danger-soft); color: var(--danger); }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 720px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { padding: 14px; border-radius: var(--radius); background: var(--bg-soft); border: 1px solid var(--border); }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 700; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .review-item { padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-elev); margin-bottom: 10px; }
  .review-item.ok { border-left: 4px solid var(--success); }
  .review-item.bad { border-left: 4px solid var(--danger); }
  .review-q { font-weight: 600; font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
  .review-opts { display: grid; gap: 6px; font-size: 13px; }
  .review-opt { padding: 8px 10px; border-radius: 8px; background: var(--bg-soft); border: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
  .review-opt.correct { border-color: color-mix(in srgb, var(--success) 50%, var(--border)); background: var(--success-soft); }
  .review-opt.wrong-user { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); background: var(--danger-soft); }
  .review-exp { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--info-soft); color: var(--text); font-size: 13px; line-height: 1.5; border-left: 3px solid var(--info); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(5, 10, 30, .55); backdrop-filter: blur(4px); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--bg-elev); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-lg); max-width: 460px; width: 100%; padding: 24px; }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .open-textarea { width: 100%; min-height: 180px; padding: 14px; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--bg-elev); color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.55; resize: vertical; }
  .open-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
  .char-counter { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .criteria-list { display: grid; gap: 8px; }

  .criteria-item:hover { background: var(--bg-elev); }

  .criteria-item input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; flex-shrink: 0; }
  .criteria-item span { font-size: 14px; line-height: 1.45; }
  body.focus-mode .side-panel, body.focus-mode .bottom-sheet { display: none !important; }
  body.focus-mode .quiz-wrap { grid-template-columns: 1fr; max-width: 760px; margin: 0 auto; }
  body.focus-mode .open-textarea { min-height: 280px; font-size: 17px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }

  @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  .int-banner { padding: 12px 16px; border-radius: var(--radius); background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--border)); font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }

  @media (max-height: 500px) and (orientation: landscape) {
    .hero { padding: 20px; } .hero-art { display: none; } main { padding: 12px 16px 80px; }
  }
  .no-copy { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

const MODULE_OF = {};
for (let i=1;i<=7;i++) MODULE_OF[i]=1;
for (let i=8;i<=14;i++) MODULE_OF[i]=2;
for (let i=15;i<=20;i++) MODULE_OF[i]=3;

const MODULE_NAMES = { 1:'M1 · Fundamentos', 2:'M2 · Prompting', 3:'M3 · Ética' };
const FAST_THRESHOLDS = { easy: 2000, med: 4500, hard: 7000 };
const OPEN_MIN_CHARS = 60;
const LS_KEY = 'udi_diag_clase1_v5_1';
const THEME_KEY = 'udi_theme_v1';

/* ---------- Scoring ---------- */
function openScore(oq){
  const txt = (state.openText[oq.id] || '').trim();
  if (txt.length < OPEN_MIN_CHARS) return 0;
  const marked = (state.openChecks[oq.id] || []).filter(Boolean).length;
  return Math.max(0, marked - 1);
}
function computeRaw(){
  let raw = 0;
  QUESTIONS.forEach(q => { if (state.answers[q.id] === q.correct) raw += q.pts; });
  OPEN_QUESTIONS.forEach(oq => { raw += openScore(oq); });
  return raw;
}
function computePct(raw){ return raw * 100 / 51; }
function levelOf(pctExacto){
  if (pctExacto <= 40) return { n:1, name:'Explorador', emoji:'🧭' };
  if (pctExacto <= 60) return { n:2, name:'Aprendiz', emoji:'🌱' };
  if (pctExacto <= 80) return { n:3, name:'Competente', emoji:'⚡' };
  return { n:4, name:'Estratégico', emoji:'🏆' };
}

/* ---------- Integridad + Anti-IA ---------- */
function fnv1a(str){
  let h = 0x811c9dc5;
  for (let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8,'0');
}
function stableStringify(obj){
  if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
  if (Array.isArray(obj)) return '[' + obj.map(stableStringify).join(',') + ']';
  const keys = Object.keys(obj).sort();
  return '{' + keys.map(k => JSON.stringify(k) + ':' + stableStringify(obj[k])).join(',') + '}';
}
function hashState(){
  return fnv1a(stableStringify({
    studentName: state.studentName,
    answers: state.answers,
    openChecks: state.openChecks,
    openText: state.openText
  }));
}
function countTooFast(){
  let c = 0;
  (state.qTiming || []).forEach(t => {
    if (!t || !t.diff) return;
    if (state.answers[t.id] === undefined) return;
    const th = FAST_THRESHOLDS[t.diff] || 99999;
    if (t.ms < th) c++;
  });
  return c;
}
function integrityColor(){
  if (state.integrityBroken) return 'red';
  const fast = countTooFast();
  const tabs = state.tabSwitches || 0;
  const totalMs = (state.timing && state.timing.totalMs) || 0;
  if (fast >= 8 || tabs >= 10 || totalMs < 90000) return 'red';
  if (fast >= 4 || tabs >= 3 || (state.pasteAttempts||0) > 0) return 'yellow';
  return 'green';
}
function integrityReason(){
  if (state.integrityBroken) return 'Se detectó alteración del estado después de finalizar.';
  const fast = countTooFast();
  const tabs = state.tabSwitches || 0;
  const totalMs = (state.timing && state.timing.totalMs) || 0;
  if (fast >= 8) return `${fast} preguntas respondidas en tiempo sospechosamente corto.`;
  if (tabs >= 10) return `${tabs} cambios de pestaña durante la prueba (posible consulta externa).`;
  if (totalMs < 90000) return `Tiempo total muy corto (${Math.floor(totalMs/1000)} s) para 23 preguntas.`;
  if (fast >= 4) return `${fast} preguntas respondidas muy rápido.`;
  if (tabs >= 3) return `${tabs} cambios de pestaña detectados.`;
  if ((state.pasteAttempts||0) > 0) return `${state.pasteAttempts} pegado(s) registrado(s) en respuestas abiertas.`;
  return '';
}

/* ---------- Shuffle con seed ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(rng() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildShuffle(){
  const seed = state.seed || (state.seed = Math.floor(Math.random()*2**31));
  const rng = mulberry32(seed);
  const byMod = { 1:[], 2:[], 3:[] };
  QUESTIONS.forEach(q => byMod[MODULE_OF[q.id]].push(q.id));
  const qOrder = [];
  [1,2,3].forEach(m => { qOrder.push(...shuffle(byMod[m], rng)); });
  const optOrder = {};
  QUESTIONS.forEach(q => {
    const r = mulberry32(seed ^ (q.id*9973));
    optOrder[q.id] = shuffle([0,1,2,3], r);
  });
  state.qOrder = qOrder;
  state.optOrder = optOrder;
}

/* ---------- Estado ---------- */
let state = {
  screen: 'start', idx: 0,
  studentName: '', // <--- Nombre agregado aquí
  answers: {}, openText: {}, openChecks: {},
  startedAt: null, finishedAt: null,
  pasteAttempts: 0, tabSwitches: 0,
  timing: { totalMs:0, perQuestion:{} }, qTiming: [], qEnterAt: null,
  hash: null, integrityBroken: false, storageOk: true,
  seed: null, qOrder: null, optOrder: null,
  review: {}, lastRenderedIdx: -1
};
let integrityTimer = null;

function saveState(){
  if (!state.storageOk) return;
  try {
    const toSave = {
      screen: state.screen, idx: state.idx,
      studentName: state.studentName, // <--- Guardar nombre
      answers: state.answers, openText: state.openText, openChecks: state.openChecks,
      startedAt: state.startedAt, finishedAt: state.finishedAt,
      pasteAttempts: state.pasteAttempts, tabSwitches: state.tabSwitches,
      timing: state.timing, qTiming: state.qTiming,
      hash: state.hash, integrityBroken: state.integrityBroken,
      seed: state.seed, qOrder: state.qOrder, optOrder: state.optOrder,
      review: state.review
    };
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
  } catch(e){ state.storageOk = false; }
}
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return false;
    if (!Array.isArray(parsed.qOrder) || parsed.qOrder.length !== QUESTIONS.length) return false;
    if (!parsed.optOrder || typeof parsed.optOrder !== 'object') return false;
    if (!Array.isArray(parsed.qTiming)) parsed.qTiming = [];
    if (!parsed.timing || typeof parsed.timing !== 'object' || Array.isArray(parsed.timing)) {
      parsed.timing = { totalMs:0, perQuestion:{} };
    }
    if (typeof parsed.tabSwitches !== 'number') parsed.tabSwitches = 0;
    if (typeof parsed.studentName !== 'string') parsed.studentName = '';
    
    state = Object.assign(state, parsed);
    state.storageOk = true;
    return true;
  } catch(e){ return false; }
}
function clearState(){
  try { localStorage.removeItem(LS_KEY); } catch(e){}
  state = {
    screen:'start', idx:0, studentName:'', answers:{}, openText:{}, openChecks:{},
    startedAt:null, finishedAt:null, pasteAttempts:0, tabSwitches:0,
    timing:{ totalMs:0, perQuestion:{} }, qTiming:[], qEnterAt:null,
    hash:null, integrityBroken:false, storageOk:true,
    seed:null, qOrder:null, optOrder:null, review:{}, lastRenderedIdx:-1
  };
}

/* Anti-IA: contar cambios de pestaña durante el quiz */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.screen === 'quiz') {
    state.tabSwitches = (state.tabSwitches || 0) + 1;
    saveState();
  }
});

/* ---------- Navegación y timing ---------- */
function currentQ(){
  if (!state.qOrder) return null;
  const id = state.qOrder[state.idx];
  return QUESTIONS.find(q => q.id === id);
}
function enterCurrentTimed(){
  state.qEnterAt = Date.now();
  state.lastRenderedIdx = state.idx;
}
function leaveCurrentTimed(){
  if (!state.qEnterAt) return;
  const ms = Date.now() - state.qEnterAt;
  state.timing.totalMs = (state.timing.totalMs||0) + ms;
  const q = currentQ();
  if (q) {
    state.timing.perQuestion[q.id] = (state.timing.perQuestion[q.id]||0) + ms;
    state.qTiming.push({ id:q.id, diff:q.diff, ms });
  }
  state.qEnterAt = null;
}
function totalAnswered(){
  let c = 0;
  QUESTIONS.forEach(q => { if (state.answers[q.id] !== undefined) c++; });
  OPEN_QUESTIONS.forEach(oq => {
    const txt = (state.openText[oq.id]||'').trim();
    if (txt.length >= OPEN_MIN_CHARS) c++;
  });
  return c;
}
function lastAnsweredIdx(){
  for (let i=state.qOrder.length-1;i>=0;i--){
    const id = state.qOrder[i];
    if (state.answers[id] !== undefined) return i;
  }
  return -1;
}
function displayLetter(q, origIdx){
  const optOrder = (state.optOrder && state.optOrder[q.id]) ? state.optOrder[q.id] : [0,1,2,3];
  const di = optOrder.indexOf(origIdx);
  const letters = ['A','B','C','D'];
  return letters[di >= 0 ? di : origIdx];
}

function startFresh(){
  state.startedAt = Date.now();
  state.screen = 'quiz';
  buildShuffle();
  enterCurrentTimed();
  saveState();
  renderQuiz();
}
function resumeAttempt(){
  if (!state.qOrder) buildShuffle();
  state.screen = 'quiz';
  renderQuiz();
  enterCurrentTimed();
  saveState();
}

/* ---------- Quiz ---------- */
function renderQuiz(){
  clearIntegrityTimer();
  updateTopbarName();
  const q = currentQ();
  if (q) renderClosedQuestion(); else renderOpenQuestion();
  startIntegrityMonitor();
}

function renderClosedQuestion(){
  const q = currentQ();
  const mod = MODULE_OF[q.id];
  const totalItems = state.qOrder.length + OPEN_QUESTIONS.length;
  const currentPos = state.idx + 1;
  const diffLabel = { easy:'Fácil', med:'Intermedia', hard:'Difícil' }[q.diff];
  const diffClass = { easy:'easy', med:'med', hard:'hard' }[q.diff];
  const selected = state.answers[q.id];
  const optOrder = state.optOrder[q.id] || [0,1,2,3];
  const letters = ['A','B','C','D'];
  const isReview = !!state.review[q.id];
  const lastAnsIdx = lastAnsweredIdx();

  $app.innerHTML = `
    <section class="screen">
      <div class="quiz-wrap">
        <div>
          <div class="card card-pad no-copy" id="q-card">
            <div class="q-header">
              <span class="module-badge m${mod}">${MODULE_NAMES[mod]}</span>
              <span class="diff-badge ${diffClass}">${diffLabel}</span>
              <span class="q-num">Pregunta ${currentPos} de ${totalItems}</span>
              <span class="q-pts">${q.pts} ${q.pts===1?'punto':'puntos'}</span>
            </div>
            <div class="progress-seg" role="progressbar" aria-valuemin="0" aria-valuemax="${totalItems}" aria-valuenow="${currentPos}" aria-label="Progreso">
              ${state.qOrder.map((qid,i) => `<div class="${state.answers[qid]!==undefined?'done':''} ${i===state.idx?'current':''}" title="Pregunta ${i+1}"></div>`).join('')}
              ${OPEN_QUESTIONS.map((oq,i) => {
                const done = (state.openText[oq.id]||'').trim().length >= OPEN_MIN_CHARS;
                return `<div class="${done?'done':''} ${state.idx===state.qOrder.length+i?'current':''}" title="${oq.title}"></div>`;
              }).join('')}
            </div>
            <div style="margin-top:18px;">
              <div class="q-text">${escapeHtml(q.q)}</div>
              <div class="opts" role="radiogroup" aria-label="Opciones de respuesta">
                ${optOrder.map((origIdx, displayIdx) => {
                  const isSel = selected === origIdx;
                  return `
                    <label class="opt" aria-pressed="${isSel}" data-orig="${origIdx}" tabindex="0" role="radio" aria-checked="${isSel}">
                      <input type="radio" name="q-${q.id}" value="${origIdx}" ${isSel?'checked':''} tabindex="-1">
                      <span class="opt-letter">${letters[displayIdx]}</span>
                      <span class="opt-text">${escapeHtml(q.opts[origIdx])}</span>
                    </label>`;
                }).join('')}
              </div>
            </div>
            <div class="q-nav">
              <button class="btn btn-ghost" id="btn-prev" ${state.idx===0?'disabled':''}>${icon('left')} Anterior</button>
              <button class="btn btn-ghost" id="btn-review" title="Marcar para revisar después (R)">${icon('flag')} ${isReview?'Marcada':'Revisar'}</button>
              <button class="btn btn-ghost" id="btn-next">${state.idx===totalItems-1?'Finalizar':'Siguiente'} ${state.idx===totalItems-1?'':icon('right')}</button>
            </div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;">
            <div class="timer-chip"><span class="timer-ring"></span><span id="timer-txt">00:00</span></div>
            <div class="timer-chip">Respondidas: <b id="answered-count">${totalAnswered()}</b> / ${totalItems}</div>
            ${lastAnsIdx >= 0 ? `<button class="btn btn-ghost" id="btn-last" style="padding:8px 12px;min-height:36px;font-size:13px;">${icon('left')} Última respondida</button>` : ''}
          </div>
        </div>
        <aside class="side-panel" id="side-panel">${sidePanelHTML()}</aside>
      </div>
      ${bottomSheetHTML()}
    </section>
  `;
  attachQuizEvents(q);
  startTimerTicker();
}

function sidePanelHTML(){
  const byMod = {1:[],2:[],3:[]};
  state.qOrder.forEach((qid,i) => byMod[MODULE_OF[qid]].push({qid,i}));
  const lastAnsIdx = lastAnsweredIdx();
  const openStartIdx = state.qOrder.length;
  return `
    <div class="card card-pad">
      <div class="panel-section"><h4>M1 · Fundamentos</h4><div class="q-dots">${byMod[1].map(({qid,i}) => qDotHTML(qid,i,lastAnsIdx)).join('')}</div></div>
      <div class="panel-section"><h4>M2 · Prompting</h4><div class="q-dots">${byMod[2].map(({qid,i}) => qDotHTML(qid,i,lastAnsIdx)).join('')}</div></div>
      <div class="panel-section"><h4>M3 · Ética</h4><div class="q-dots">${byMod[3].map(({qid,i}) => qDotHTML(qid,i,lastAnsIdx)).join('')}</div></div>
      <div class="panel-section"><h4>Abiertas</h4><div class="q-dots" style="grid-template-columns:repeat(3,1fr);">
        ${OPEN_QUESTIONS.map((oq,i) => {
          const idx = openStartIdx + i;
          const done = (state.openText[oq.id]||'').trim().length >= OPEN_MIN_CHARS;
          const cur = state.idx === idx;
          const rev = !!state.review[oq.id];
          return `<button class="q-dot ${cur?'current':''} ${done?'answered':''} ${rev?'review':''}" data-idx="${idx}" title="${oq.title}">${i+1}</button>`;
        }).join('')}
      </div></div>
    </div>
  `;
}
function qDotHTML(qid, i, lastAnsIdx){
  const done = state.answers[qid] !== undefined;
  const cur = i === state.idx;
  const rev = !!state.review[qid];
  const last = i === lastAnsIdx;
  return `<button class="q-dot ${cur?'current':''} ${done?'answered':''} ${rev?'review':''} ${last?'last-answered':''}" data-idx="${i}" title="Pregunta ${qid}">${i+1}</button>`;
}
function bottomSheetHTML(){
  return `
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header" id="sheet-toggle"><h3>Navegación</h3><span class="chip">${totalAnswered()} / ${state.qOrder.length + OPEN_QUESTIONS.length}</span></div>
      <div class="sheet-body" id="sheet-body">${sidePanelHTML()}</div>
    </div>
  `;
}

function attachQuizEvents(q){
  document.querySelectorAll('.opt').forEach(el => {
    const handler = (e) => {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      if (e.type === 'keydown') e.preventDefault();
      const orig = Number(el.dataset.orig);
      state.answers[q.id] = orig;
      saveState();
      document.querySelectorAll('.opt').forEach(o => {
        const sel = Number(o.dataset.orig) === orig;
        o.setAttribute('aria-pressed', sel);
        o.setAttribute('aria-checked', sel);
        o.querySelector('input').checked = sel;
      });
      updateAnsweredCount(); updateSidePanel();
      try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){}
    };
    el.addEventListener('click', handler);
    el.addEventListener('keydown', handler);
  });
  document.getElementById('btn-prev')?.addEventListener('click', () => goIdx(state.idx - 1));
  document.getElementById('btn-next')?.addEventListener('click', () => {
    if (state.idx === state.qOrder.length + OPEN_QUESTIONS.length - 1) confirmFinish();
    else goIdx(state.idx + 1);
  });
  document.getElementById('btn-review')?.addEventListener('click', () => {
    state.review[q.id] = !state.review[q.id];
    saveState(); updateSidePanel();
    document.getElementById('btn-review').innerHTML = `${icon('flag')} ${state.review[q.id]?'Marcada':'Revisar'}`;
  });
  document.getElementById('btn-last')?.addEventListener('click', () => {
    const li = lastAnsweredIdx();
    if (li >= 0) goIdx(li);
  });
  document.querySelectorAll('.q-dot').forEach(d => d.addEventListener('click', () => goIdx(Number(d.dataset.idx))));
  const sheet = document.getElementById('bottom-sheet');
  document.getElementById('sheet-toggle')?.addEventListener('click', () => sheet?.classList.toggle('open'));
  const card = document.getElementById('q-card');
  if (card){
    card.addEventListener('contextmenu', (e) => {
      if (e.target.closest('button, input, label.opt')) return;
      e.preventDefault();
    });
    card.addEventListener('copy', (e) => {
      const t = window.getSelection && window.getSelection().anchorNode;
      if (t && t.parentElement && t.parentElement.closest('button, input')) return;
      e.preventDefault();
      showToast('Copiado deshabilitado en la pregunta');
    });
  }
}
function updateAnsweredCount(){
  const el = document.getElementById('answered-count');

}
function updateSidePanel(){

function goIdx(newIdx){
  const total = state.qOrder.length + OPEN_QUESTIONS.length;
  if (newIdx < 0 || newIdx >= total) return;
  leaveCurrentTimed();
  state.idx = newIdx;
  saveState();
  renderQuiz();
  enterCurrentTimed();
}

/* ---------- Timer ticker ---------- */
let tickerTimer = null;
function startTimerTicker(){
  clearInterval(tickerTimer);
  const el = document.getElementById('timer-txt');
  if (!el) return;
  const tick = () => {
    if (!state.qEnterAt) return;
    el.textContent = formatMs(Date.now() - state.qEnterAt);
  };
  tick();
  tickerTimer = setInterval(tick, 500);
}
function formatMs(ms){
  const s = Math.floor(ms/1000), m = Math.floor(s/60), r = s%60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function formatMsLong(ms){
  const s = Math.floor(ms/1000), m = Math.floor(s/60), r = s%60;
  return m === 0 ? `${r} s` : `${m} min ${r} s`;
}

/* ---------- Integrity monitor ---------- */
function startIntegrityMonitor(){
  clearIntegrityTimer();
  integrityTimer = setInterval(() => {
    if (state.screen !== 'quiz') return;
    if (state.hash && hashState() !== state.hash){
      state.integrityBroken = true;
      saveState();
      showToast('⚠ Integridad comprometida', 3500);
    }
  }, 2000);
}

/* ---------- Finish modal ---------- */
function confirmFinish(){
  const total = state.qOrder.length + OPEN_QUESTIONS.length;
  const answered = totalAnswered();
  const pending = total - answered;
  const reviewCount = Object.values(state.review).filter(Boolean).length;
  const tabs = state.tabSwitches || 0;
  openModal({
    title: '¿Finalizar la prueba?',
    text: `Tienes ${answered} de ${total} preguntas respondidas.${pending>0?` Faltan ${pending}.`:''}${reviewCount>0?` Marcaste ${reviewCount} para revisar.`:''}${tabs>0?` Se detectaron ${tabs} cambios de pestaña.`:''} Una vez finalices, no podrás modificar tus respuestas.`,
    confirmText: 'Sí, finalizar', cancelText: 'Seguir respondiendo',
    onConfirm: () => finishAttempt()
  });
}
function finishAttempt(){
  leaveCurrentTimed();
  state.finishedAt = Date.now();
  state.hash = hashState();
  state.screen = 'results';
  saveState();
  renderResults();
}

/* ---------- Modal / Confetti ---------- */
function openModal({ title, text, confirmText='Confirmar', cancelText='Cancelar', onConfirm, danger=false }){
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h3 id="m-title">${escapeHtml(title)}</h3>
      <p>${escapeHtml(text)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="m-cancel">${escapeHtml(cancelText)}</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="m-confirm">${escapeHtml(confirmText)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(bd);
  const close = () => bd.remove();
  bd.querySelector('#m-cancel').addEventListener('click', close);
  bd.querySelector('#m-confirm').addEventListener('click', () => { close(); onConfirm && onConfirm(); });
  bd.addEventListener('click', (e) => { if (e.target === bd) close(); });
  setTimeout(() => bd.querySelector('#m-confirm').focus(), 50);
}
function launchConfetti(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('div');
  c.className = 'confetti';
  const colors = ['#6366f1','#a855f7','#0ea5e9','#10b981','#f59e0b','#ef4444'];
  for (let i=0;i<80;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.background = colors[Math.floor(Math.random()*colors.length)];
    s.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
    s.style.animationDelay = (Math.random()*1.2) + 's';
    s.style.transform = `rotate(${Math.random()*360}deg)`;
    s.style.width = (6 + Math.random()*8) + 'px';
    s.style.height = (8 + Math.random()*10) + 'px';
    s.style.borderRadius = Math.random() < .5 ? '2px' : '50%';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 6000);
}

/* ---------- Exports ---------- */
function buildReport(){
  const raw = computeRaw();
  const pct = computePct(raw);
  const lvl = levelOf(pct);
  const durationMs = (state.timing && state.timing.totalMs) || (state.finishedAt - state.startedAt);
  return {
    meta: { title:'UDI · Prueba Diagnóstica · Industria 4.0 e IA · Clase 1', estudiante: state.studentName || 'Sin nombre', generatedAt:new Date().toISOString(), startedAt:state.startedAt, finishedAt:state.finishedAt, durationMs },
    puntaje: { raw, pct:+pct.toFixed(2), max:51, nivel:lvl.n, nivelNombre:lvl.name },
    integridad: {
      hash:state.hash, color:integrityColor(),
      pasteAttempts:state.pasteAttempts||0, tooFast:countTooFast(),
      tabSwitches:state.tabSwitches||0, broken:!!state.integrityBroken
    },
    respuestas: {
      cerradas: QUESTIONS.map(q => {
        const user = state.answers[q.id];
        return {
          id:q.id, modulo:MODULE_OF[q.id], dificultad:q.diff, puntos:q.pts, enunciado:q.q,
          respondidaTexto: user!==undefined ? `${displayLetter(q,user)}. ${q.opts[user]}` : '(sin responder)',
          respondidaIndice: user,
          correctaTexto: `${displayLetter(q,q.correct)}. ${q.opts[q.correct]}`,
          correctaIndice: q.correct,
          correcta: user === q.correct,
          explicacion: q.exp
        };
      }),
      abiertas: OPEN_QUESTIONS.map(oq => ({
        id:oq.id, titulo:oq.title, enunciado:oq.prompt, texto:(state.openText[oq.id]||'').trim(),
        criterios: CRITERIA.map((c,i) => ({ texto:c, marcado: !!(state.openChecks[oq.id]||[])[i] })),
        score: openScore(oq), max: oq.pts
      }))
    }
  };
}
function downloadJSON(){
  const rep = buildReport();
  const blob = new Blob([JSON.stringify(rep, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `udi_diagnostico_clase1_${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('JSON descargado');
}
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 40, cw = W - M*2;
  let y = M;
  const rep = buildReport();
  const lvl = levelOf(rep.puntaje.pct);

  doc.setFillColor(99,102,241); doc.rect(0,0,W,60,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('UDI - Prueba Diagnostica - Industria 4.0 e IA', M, 38);
  y = 90;
  doc.setTextColor(15,23,42);
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Resultado general', M, y); y += 20;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  
  const lines = [
    `Estudiante: ${rep.meta.estudiante}`,
    `Nivel: ${lvl.n} - ${lvl.name}`,
    `Puntaje: ${rep.puntaje.raw} / ${rep.puntaje.max}  (${rep.puntaje.pct.toFixed(2)}%)`,
    `Duracion: ${formatMsLong(rep.meta.durationMs)}`,
    `Pegados: ${rep.integridad.pasteAttempts}   Rapidas: ${rep.integridad.tooFast}   Tabs: ${rep.integridad.tabSwitches}`,
    `Integridad: ${rep.integridad.color.toUpperCase()}   Hash: ${rep.integridad.hash || '-'}`
  ];
  lines.forEach(l => { doc.text(l, M, y); y += 16; });
  y += 8;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Respuestas cerradas', M, y); y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  rep.respuestas.cerradas.forEach(r => {
    if (y > H - 80) { doc.addPage(); y = M; }
    doc.setFont('helvetica','bold');
    doc.text(`P${r.id} [M${r.modulo}/${r.dificultad}] (${r.puntos} pts) - ${r.correcta?'OK':'X'}`, M, y); y += 13;
    doc.setFont('helvetica','normal');
    const qLines = doc.splitTextToSize(r.enunciado, cw);
    doc.text(qLines, M, y); y += qLines.length * 12;
    doc.setTextColor(80,80,80);
    const tuLines = doc.splitTextToSize(`Tu respuesta: ${r.respondidaTexto}`, cw);
    doc.text(tuLines, M, y); y += tuLines.length * 12;
    const corrLines = doc.splitTextToSize(`Correcta:     ${r.correctaTexto}`, cw);
    doc.text(corrLines, M, y); y += corrLines.length * 12;
    doc.setTextColor(15,23,42);
    const expLines = doc.splitTextToSize('Explicacion: ' + r.explicacion, cw);
    doc.text(expLines, M, y); y += expLines.length * 12 + 8;
  });
  if (y > H - 120) { doc.addPage(); y = M; }
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Respuestas abiertas', M, y); y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  rep.respuestas.abiertas.forEach(o => {
    if (y > H - 100) { doc.addPage(); y = M; }
    doc.setFont('helvetica','bold');
    doc.text(`${o.id} - ${o.titulo}  (score ${o.score}/${o.max})`, M, y); y += 13;
    doc.setFont('helvetica','normal');
    const tLines = doc.splitTextToSize('Texto: ' + (o.texto || '(sin respuesta)'), cw);
    doc.text(tLines, M, y); y += tLines.length * 12;
    const marked = o.criterios.filter(c=>c.marcado).map(c=>c.texto);
    const mLines = doc.splitTextToSize('Criterios marcados: ' + (marked.length?marked.join(' | '):'(ninguno)'), cw);
    doc.text(mLines, M, y); y += mLines.length * 12 + 8;
  });
  doc.save(`udi_diagnostico_${(rep.meta.estudiante || 'anonimo').replace(/\s+/g, '_')}_${Date.now()}.pdf`);
  showToast('PDF descargado');
}
async function copyDoc(){
  const rep = buildReport();
  const lvl = levelOf(rep.puntaje.pct);
  const txt = [
    'UDI - Prueba Diagnostica - Industria 4.0 e IA - Clase 1',
    `Estudiante: ${rep.meta.estudiante}`,
    `Nivel: ${lvl.n} - ${lvl.name}`,
    `Puntaje: ${rep.puntaje.raw}/51 (${rep.puntaje.pct.toFixed(2)}%)`,
    `Duracion: ${formatMsLong(rep.meta.durationMs)}`,
    `Integridad: ${rep.integridad.color.toUpperCase()}`,
    `Tabs: ${rep.integridad.tabSwitches}  Pegados: ${rep.integridad.pasteAttempts}  Rapidas: ${rep.integridad.tooFast}`,
    `Hash: ${rep.integridad.hash || '-'}`,
    '', `Respondidas: ${totalAnswered()}/${QUESTIONS.length + OPEN_QUESTIONS.length}`
  ].join('\n');
  try { await navigator.clipboard.writeText(txt); showToast('Resumen copiado'); }
  catch(e){ showToast('No se pudo copiar'); }
}

/* ---------- Theme ---------- */
function updateThemeIcons(){
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('icon-sun').style.display = dark ? 'block' : 'none';
  document.getElementById('icon-moon').style.display = dark ? 'none' : 'block';
}
updateThemeIcons();
document.addEventListener('click', (e) => {
  if (!e.target.closest('#theme-toggle')) return;
  const dark = document.documentElement.classList.toggle('dark');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch(err){}
  updateThemeIcons();
});

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', (e) => {
  if (state.screen !== 'quiz') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  const q = currentQ();
  if (q && /^[1-4]$/.test(e.key)){
    const idx = Number(e.key) - 1;
    const optOrder = state.optOrder[q.id] || [0,1,2,3];
    if (optOrder[idx] !== undefined){
      state.answers[q.id] = optOrder[idx];
      saveState();
      renderQuiz(); enterCurrentTimed();
      e.preventDefault();
    }
    return;
  }
  if (e.key === 'ArrowRight'){
    const total = state.qOrder.length + OPEN_QUESTIONS.length;
    if (state.idx < total - 1) { goIdx(state.idx + 1); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowLeft'){
    if (state.idx > 0) { goIdx(state.idx - 1); e.preventDefault(); }
    return;
  }
  if (e.key.toLowerCase() === 'r' && q){
    state.review[q.id] = !state.review[q.id];
    saveState(); updateSidePanel();
    const btn = document.getElementById('btn-review');
    if (btn) btn.innerHTML = `${icon('flag')} ${state.review[q.id]?'Marcada':'Revisar'}`;
    return;
  }
  if (e.key.toLowerCase() === 'f'){
    document.body.classList.toggle('focus-mode');
    const btn = document.getElementById('btn-focus');
    if (btn) btn.innerHTML = document.body.classList.contains('focus-mode') ? `${icon('focus')} Salir focus` : `${icon('focus')} Focus`;
  }
});

/* ---------- Util ---------- */
function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

/* ---------- Init ---------- */
(function init(){
  try { localStorage.removeItem('udi_diag_clase1_v4'); } catch(e){}  
  const loaded = loadState();
  if (loaded && state.screen === 'results' && state.finishedAt){ renderResults(); }
  else { renderStart(); }
})();
</script>
